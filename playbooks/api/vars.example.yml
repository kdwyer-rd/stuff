---
# Copy to vars.yml (do not commit secrets) or pass with -e / AAP survey.
aap_host: "https://example-aap.apps.rosa.kpkuy-2yi3d-fvi.cspo.p3.openshiftapps.com"
aap_validate_certs: true

# Prefer a personal access / OAuth2 token in production.
aap_token: ""

# Used only when aap_token is empty.
aap_username: "admin"
