# Target play to launch via the Controller API
job_template_name: "stuff-hello_world"
# Optional override; when empty the playbook looks up the JT by name.
job_template_id: ""

# Extra variables forwarded into the launched job (must match JT survey/vars).
job_extra_vars: {}
