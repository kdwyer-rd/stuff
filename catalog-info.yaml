apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: stuff
  title: stuff
  description: Ansible content from kdwyer-rd/stuff (hello_world, patching_linux, EDA rulebooks)
  annotations:
    github.com/project-slug: kdwyer-rd/stuff
    backstage.io/source-location: url:https://github.com/kdwyer-rd/stuff/
  tags:
    - ansible
    - aap
    - playbooks
  links:
    - url: https://github.com/kdwyer-rd/stuff
      title: GitHub Repository
      icon: github
spec:
  type: service
  lifecycle: experimental
  owner: user:default/admin
  system: ansible-automation
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: stuff-location
  description: Catalog entry for kdwyer-rd/stuff
spec:
  type: url
  targets:
    - https://github.com/kdwyer-rd/stuff/blob/main/catalog-info.yaml
